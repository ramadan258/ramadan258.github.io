<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><title>التقرير اليومي — الموحدون</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="planner.css"><link rel="stylesheet" href="session.css"><link rel="stylesheet" href="extension.css">
  <script src="session-config.js"></script><script src="session-runtime.js"></script><script type="module" src="report-ui.js"></script>
</head>
<body class="session-pending" data-session-private-page>
  <dialog class="khutay-window report-window" id="reportWindow" aria-labelledby="reportTitle">
    <header class="window-header"><div class="window-title"><h1 id="reportTitle">التقرير اليومي</h1><span id="accountLabel"></span></div>
      <button class="icon-button close-button" id="closeReport" aria-label="إغلاق التقرير"><svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="window-content">
      <div class="report-date"><span id="reportDate"></span><input type="date" id="reportDay" class="date-picker" aria-label="تاريخ التقرير"></div>
      <section class="section-block"><div class="section-heading"><h3>عادات التعافي</h3><span class="section-count" id="reportCount"></span></div><div id="reportHabits"></div></section>
      <section class="section-block report-layout" id="reportFields">
        <label class="add-field"><span>اليوم رقم في رحلة التعافي</span><input name="dayNo" type="number" min="0" max="100000"></label>
        <label class="add-field"><span>شعوري العام</span><input name="feeling" maxlength="10000"></label>
        <label class="add-field"><span>جانب «لا تقربوا»</span><textarea name="avoided" maxlength="10000"></textarea></label>
        <label class="add-field"><span>الحمد</span><textarea name="gratitude" maxlength="10000"></textarea></label>
        <label class="add-field report-wide"><span>ملخص يومي</span><textarea name="summary" maxlength="10000"></textarea></label>
        <label class="add-field"><span>التحفيز الذاتي</span><textarea name="motivation" maxlength="10000"></textarea></label>
        <label class="add-field"><span>ملاحظات مهمة</span><textarea name="notes" maxlength="10000"></textarea></label>
      </section>
      <div class="report-buttons"><button class="save-button" id="saveReport">حفظ التقرير</button><button class="cancel-button" id="copyReport">نسخ التقرير</button><a class="list-toggle" href="khutay.html">خُطاي</a></div>
      <textarea class="export-preview" id="reportText" aria-label="نص التقرير" readonly hidden></textarea>
    </div>
    <footer class="window-footer"><span id="saveStatus" role="status"></span><button class="list-toggle" id="retrySave" hidden>إعادة الحفظ</button><button class="list-toggle" id="resolveConflict" hidden>مراجعة التعارض</button></footer>
  </dialog>
</body></html>
