name: Public bracelet colors
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-bracelet-colors
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'ramadan258/ramadan258.github.io' &&
      github.ref == 'refs/heads/main' &&
      vars.PUBLIC_BRACELETS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/public-bracelet.test.mjs
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: auth
        with:
          workload_identity_provider: ${{ vars.BRACELETS_WIF_PROVIDER }}
          service_account: wa3i-bracelets-publisher@tribe-app-e3e9c.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/datastore
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - run: node scripts/bracelets/publish.mjs
        env:
          PUBLIC_BRACELETS_ENABLED: ${{ vars.PUBLIC_BRACELETS_ENABLED }}
          BRACELETS_READ_TOKEN: ${{ steps.auth.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
