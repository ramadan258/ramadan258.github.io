name: Firestore Safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  approved-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/security/verify-rules.test.cjs
      - run: node scripts/security/verify-rules.cjs
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - run: node scripts/security/verify-pages.mjs _site
