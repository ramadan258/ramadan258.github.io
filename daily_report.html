<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><title>التقرير اليومي — الموحدون</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="planner.css?v=353e61758dbf"><link rel="stylesheet" href="session.css?v=d1ddf958c999"><link rel="stylesheet" href="extension.css?v=f3001815b949"><link rel="stylesheet" href="report-wizard.css?v=c70baa29f4f4">
  <script src="performance.js?v=b40a86ef6bca"></script><script src="session-config.js?v=3ca295450b3c"></script><script src="session-runtime.js?v=b4a9bcd4225e"></script><script type="module" src="client/report-ui-RPUAKTEB.js?v=e2e60ada511a"></script>
<link rel="stylesheet" href="bracelet.css?v=cb4403670d6d"><script type="module" src="client/bracelet-ui-4QP46GZL.js?v=6ff20fa81ce3"></script></head>
<body class="session-pending" data-session-private-page>
  <dialog class="khutay-window report-window" id="reportWindow" aria-labelledby="reportTitle">
    <header class="window-header"><div class="window-title"><h1 id="reportTitle">التقرير اليومي</h1></div>
      <button class="icon-button close-button" id="closeReport" aria-label="إغلاق التقرير"><svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="window-content">
      <div class="report-date"><span id="reportDate"></span><input type="date" id="reportDay" class="date-picker" aria-label="تاريخ التقرير"></div>
      <div class="report-progress">
        <div class="report-progress-label"><span id="stepCount"></span><span id="stepPercent"></span></div>
        <progress id="stepProgress" max="100" value="0" aria-label="التقدم في التقرير"></progress>
      </div>
      <section class="report-question-card" id="reportStep" aria-labelledby="reportQuestion">
        <div class="section-heading"><span id="stepSection"></span><span class="section-count" id="reportCount"></span></div>
        <h2 id="reportQuestion" tabindex="-1"></h2>
        <div id="reportHabits" hidden></div>
        <div id="reportFields" hidden></div>
        <div id="reportReview" hidden><textarea class="export-preview" id="reportText" aria-label="نص التقرير" readonly></textarea></div>
      </section>
      <nav class="report-navigation" aria-label="التنقل بين أسئلة التقرير">
        <button class="cancel-button" id="previousQuestion" type="button">السابق</button>
        <button class="save-button" id="nextQuestion" type="button">التالي</button>
      </nav>
      <div class="report-buttons"><button class="save-button" id="saveReport">حفظ التقرير</button><a class="report-secondary" id="openKhutay" href="khutay.html?release=20261016-8591bff89380">خُطاي</a><button class="cancel-button" id="copyReport" hidden>نسخ التقرير</button></div>
    </div>
    <footer class="window-footer"><span id="saveStatus" role="status"></span><button class="list-toggle" id="retrySave" hidden>إعادة الحفظ</button><button class="list-toggle" id="resolveConflict" hidden>مراجعة التعارض</button></footer>
  </dialog>
</body></html>
